!
hostname bgpd
password zebra
enable password zebra
!
router bgp 40
network 40.4.4.0/24
network 40.4.5.0/24
network 40.4.6.0/24
network 11.0.0.12/30
network 11.0.0.28/30
!
neighbor 11.0.0.13 remote-as 300
neighbor 11.0.0.13 description Router as300r2
neighbor 11.0.0.13 default-originate
neighbor 11.0.0.13 prefix-list as300In in
neighbor 11.0.0.13 prefix-list as300out out
!
neighbor 11.0.0.30 remote-as 1
neighbor 11.0.0.30 description Router as1r1 (eBGP)

neighbor 40.4.6.2 remote-as 40
neighbor 40.4.6.2 description Router as40r3 (iBGP)
neighbor 40.4.6.2 default-originate
neighbor 40.4.6.2 route-reflector-client

neighbor 40.4.5.2 remote-as 40
neighbor 40.4.5.2 description Router as40r2 (iBGP)
neighbor 40.4.5.2 next-hop-self

!
ip prefix-list as300In permit 200.1.0.0/16
ip prefix-list as300In permit 200.1.128.0/17
ip prefix-list as300out permit 0.0.0.0/0
ip prefix-list as300out permit 200.3.0.0/16
!
log file /var/log/quagga/bgpd.log
!
debug bgp
debug bgp events
debug bgp filters
debug bgp fsm
debug bgp keepalives
debug bgp updates 
!
