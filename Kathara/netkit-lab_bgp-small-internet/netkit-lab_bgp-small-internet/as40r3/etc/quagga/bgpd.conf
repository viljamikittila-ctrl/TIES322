!
hostname bgpd
password zebra
enable password zebra
!
router bgp 40
network 40.4.6.0/24
network 11.0.0.40/30
!
neighbor 11.0.0.41 remote-as 400
neighbor 11.0.0.41 description Router as400r1
neighbor 11.0.0.41 default-originate
neighbor 11.0.0.41 prefix-list as400In in
!
neighbor 40.4.6.1 remote-as 40
neighbor 40.4.6.1 description Router as40r1 (iBGP)
neighbor 40.4.6.1 next-hop-self
!
ip prefix-list as400In permit 200.3.0.0/16
!
log file /var/log/quagga/bgpd.log
!
debug bgp
debug bgp events
debug bgp filters
debug bgp fsm
debug bgp keepalives
debug bgp updates 
!
