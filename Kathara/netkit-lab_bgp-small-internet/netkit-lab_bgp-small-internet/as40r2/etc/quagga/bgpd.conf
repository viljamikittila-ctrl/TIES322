!
hostname bgpd
password zebra
enable password zebra
!
router bgp 40
network 40.4.5.0/24
network 11.0.0.36/30
!
neighbor 11.0.0.37 remote-as 30
neighbor 11.0.0.37 description Router as30r1 (eBGP)
neighbor 11.0.0.37 route-map as30 in
neighbor 11.0.0.37 prefix-list as40as400out out
!
neighbor 40.4.5.1 remote-as 40
neighbor 40.4.5.1 description Router as40r1 (iBGP)
neighbor 40.4.5.1 next-hop-self
neighbor 40.4.5.2 route-reflector-client

ip prefix-list defaultOK permit 0.0.0.0/0
ip prefix-list as30in permit 30.3.3.0/24 le 32
ip prefix-list as40as400out permit 40.4.0.0/16
ip prefix-list as40as400out permit 200.3.0.0/16

route-map as30 permit 10
 match ip address prefix-list defaultOK
 set local-preference 50
route-map as30 permit 20
 match ip address prefix-list as30in
!
log file /var/log/quagga/bgpd.log
!
debug bgp
debug bgp events
debug bgp filters
debug bgp fsm
debug bgp keepalives
debug bgp updates 
!
